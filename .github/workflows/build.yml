name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels any older build still queued or running.
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project LockIn.xcodeproj \
            -scheme LockIn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E ": error: " build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LockIn.app Payload/
          zip -qry LockIn.ipa Payload

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LockIn.ipa \
            --target "${{ github.sha }}" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Unsigned build of ${{ github.sha }}. Install with Sideloadly."
