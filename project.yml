name: LockIn
options:
  bundleIdPrefix: com.lockin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    sources:
      - path: LockIn
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.focuslapse
        PRODUCT_NAME: LockIn
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: LockIn/Info.plist
      properties:
        CFBundleDisplayName: Tunnel
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: Tunnel records a timelapse of your focus session.
        NSMotionUsageDescription: Tunnel notices when you pick up your phone during a session.
        NSPhotoLibraryAddUsageDescription: Save your session timelapse and cover to Photos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
